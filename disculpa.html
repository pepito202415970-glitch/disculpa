<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>¿Me disculpas, nena?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #fff0f5;
            padding-top: 100px;
            overflow: hidden;
        }

        h1 {
            font-size: 2em;
            color: #d6336c;
        }

        .botones {
            margin-top: 30px;
        }

        button {
            font-size: 1.2em;
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #si {
            background-color: #28a745;
            color: white;
        }

        #no {
            background-color: #dc3545;
            color: white;
        }

        #mensaje {
            margin-top: 30px;
            font-size: 1.5em;
            color: #6f42c1;
        }

        #imagen {
            margin-top: 20px;
            display: none;
        }

        #imagen img {
            width: 200px;
        }

        .corazon {
            position: fixed;
            top: -50px;
            color: red;
            font-size: 24px;
            animation: caer 5s linear infinite;
            user-select: none;
            pointer-events: none;
        }

        @keyframes caer {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <h1>¿Me disculpas, nena?</h1>

    <div class="botones">
        <button id="si">Sí</button>
        <button id="no">No</button>
    </div>

    <div id="mensaje"></div>
    <div id="imagen">
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAOEAAADhCAMAAAAJbSJIAAAAjVBMVEX///8AAAD19fX09PT8/PyCgoKUlJTDw8NwcHBuYmK+vr7FxcXf399vb2+srKzq6uqnp6e2trZiYmImJiYqKiqkpKTa2tqcnJx7e3vw8PDNzc2MjIykpKScnJx4eHiWlpZNTU1GRkaGhoZ2dnaDg4NJSUlmZmaYmJilpaWNjY2VlZUNFQjFAAAFiUlEQVR4nO2diXaiMBBGEyKgpAmlILzK7e7/f79TLUCF9jZqgHy6nt/y4NZQSlFsJDQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHjW9W9GHnsc+Nn/UqT6Og/LuzLEB0ci93nr9HG0bb3D1PKbX+32koIXV0KvxkNGyo/hQxPyRoVpv5nT8/Y1PeWYpafAjLEmMJzFRg9p+b4YX3HtLGEy4qfz3yGUdGrBlXNTRK5P38N0MR1nVD2g4vu0KqSnnO/xSl9vPqL1Tr+auavQ5TL7soC1TbSijPYwQ+7A33WktmcBLRv1G08j2xGg8ZqG6uRAfMv7Khhpyn1MJ2b++pdlf1yJkbg1n1LDW7xN1UdWh7sHgNGjPpa5vphU3C3aBhxzeK27bVRULUbMqtv+UujSc1xTv+8yI//ZosO+bKkUceOKi6Ni+0d3aVaX0G5T+wPeSu1yC3aOQ1qV1zMxG26zv6DGMcZxFE91tqFbMxZVhnXzUK3VJYW8vSzF2plbP8E2PYmK1bK9GjND7Rf3yXkscaJNZDL+/EzYX+VySz43sJh5J3GPRNz+7PRmt3H7r7QzZslM1dP4aFS8jM29pwbGl77RZo2Xt1OKiODXKMkku6WliZv+onOlcvm+/Lxq7q8RSykZ6DSlKqIzK1mc0Ule0rYrdp7QybZ3cVnI/fK0I7u32jS3eb7VEXDmfVql7PjUt+svKm9an4xd1TzZoeV/UuT9i9uZXzbv5X+eODt3vl7e7ftlvmY2Fh3fL17u8c9yuMHnSltp6vU3aWxI7vXXu+F3+9F7p/+NVs/0O/n+8jZrEAAAAAAAAAAAAAAAAAAAAAAAAAAAAA8If/AcyMOfpO5D7pAAAAAElFTkSuQmCC" alt="Ositos abrazándose">
    </div>

    <script>
        const btnSi = document.getElementById("si");
        const btnNo = document.getElementById("no");
        const mensaje = document.getElementById("mensaje");
        const imagen = document.getElementById("imagen");

        let noBtnSize = 1;

        btnSi.addEventListener("click", () => {
            mensaje.textContent = "Te amo mi amor, gracias por disculparme 💖";
            imagen.style.display = "block";
            btnSi.style.display = "none";
            btnNo.style.display = "none";

            lanzarCorazones();
        });

        btnNo.addEventListener("click", () => {
            noBtnSize -= 0.1;
            if (noBtnSize <= 0) {
                btnNo.style.display = "none";
            } else {
                btnNo.style.transform = `scale(${noBtnSize})`;
            }
        });

        function lanzarCorazones() {
            setInterval(() => {
                const corazon = document.createElement("div");
                corazon.classList.add("corazon");
                corazon.innerText = "💖";
                corazon.style.left = Math.random() * 100 + "vw";
                corazon.style.fontSize = (Math.random() * 20 + 20) + "px";
                document.body.appendChild(corazon);

                setTimeout(() => {
                    corazon.remove();
                }, 5000);
            }, 200);
        }
    </script>
</body>
</html>
